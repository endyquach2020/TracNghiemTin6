<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BÀI 4: MẠNG MÁY TÍNH</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }

    /* Header siêu mỏng 1 dòng */
    header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      padding: 6px 16px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    header h1 { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.5px; }

    /* Layout */
    .layout-wrapper {
      max-width: 1100px;
      margin: 12px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 850px) {
      .layout-wrapper {
        grid-template-columns: 1fr;
      }
    }

    /* Left Sidebar */
    .sidebar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: sticky;
      top: 12px;
    }
    .sidebar-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .palette-item {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      color: #334155;
      transition: all 0.2s;
    }
    .palette-item:hover { border-color: var(--primary-light); background: #eff6ff; }
    
    /* Trạng thái danh sách */
    .palette-item.current {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .palette-item.answered {
      background-color: var(--primary-light);
      border-color: var(--primary);
      color: white;
      font-weight: bold;
    }
    .palette-item.correct {
      background-color: var(--success) !important;
      border-color: #059669 !important;
      color: white !important;
    }
    .palette-item.wrong {
      background-color: var(--danger) !important;
      border-color: #b91c1c !important;
      color: white !important;
    }

    .palette-legend {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-box { width: 14px; height: 14px; border-radius: 4px; border: 1px solid #cbd5e1; }

    /* Content Area */
    .content-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Result Banner */
    .result-banner {
      display: none;
      background: #f0fdf4;
      border: 2px solid var(--success);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .result-score { font-size: 2.2rem; font-weight: 800; color: #166534; }
    .result-text { font-size: 1.05rem; color: #15803d; margin-top: 4px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Quiz Card */
    .question-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid #f1f5f9;
    }
    .q-badge {
      background: #e0e7ff;
      color: var(--primary);
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .q-type { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

    .q-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .q-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      text-align: left;
      padding: 12px 16px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      color: #334155;
      transition: all 0.15s;
    }
    .opt-btn:hover:not(.disabled) { border-color: var(--primary-light); background: #eff6ff; }
    .opt-btn.selected { border-color: var(--primary); background: #dbeafe; font-weight: 600; }
    
    /* Result states */
    .opt-btn.correct-ans { background: #dcfce7 !important; border-color: var(--success) !important; color: #166534 !important; font-weight: bold; }
    .opt-btn.wrong-ans { background: #fee2e2 !important; border-color: var(--danger) !important; color: #991b1b !important; }

    /* Navigation Buttons */
    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      gap: 12px;
    }
    .btn-nav {
      background: #ffffff;
      color: var(--primary);
      border: 1.5px solid var(--primary-light);
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-nav:hover:not(:disabled) { background: var(--primary-light); color: white; }
    .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; border-color: #cbd5e1; color: var(--text-muted); }

    .btn-action-container {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .btn-submit {
      background: var(--success); color: white; border: none;
      padding: 12px 32px; font-size: 1.05rem; font-weight: 700;
      border-radius: 8px; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25);
    }
    .btn-submit:hover { background: #059669; }
    .btn-reset {
      background: #64748b; color: white; border: none;
      padding: 12px 24px; font-size: 1.05rem; font-weight: 600;
      border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .btn-reset:hover { background: #475569; }
  </style>
</head>
<body>

  <header>
    <h1>BÀI 4: MẠNG MÁY TÍNH</h1>
  </header>

  <div class="layout-wrapper">
    
    <!-- CỘT BẢNG SỐ CÂU (BÊN TRÁI) -->
    <div class="sidebar">
      <div class="sidebar-title">
        <span>Bảng câu hỏi</span>
        <span style="font-size:0.85rem; font-weight:normal;" id="answeredCount">0/28 đã làm</span>
      </div>
      <div class="palette-grid" id="paletteGrid">
        <!-- Tự động sinh ra 28 ô câu hỏi qua JS -->
      </div>
      <div class="palette-legend">
        <div class="legend-item"><div class="legend-box" style="background:#f8fafc;"></div> Chưa làm</div>
        <div class="legend-item"><div class="legend-box" style="background:var(--primary-light);"></div> Đã chọn đáp án</div>
        <div class="legend-item"><div class="legend-box" style="background:var(--success);"></div> Câu trả lời đúng</div>
        <div class="legend-item"><div class="legend-box" style="background:var(--danger);"></div> Câu trả lời sai</div>
      </div>
    </div>

    <!-- KHU VỰC LÀM BÀI 1 CÂU (BÊN PHẢI) -->
    <div class="content-area">

      <!-- Bảng kết quả sau nộp -->
      <div id="resultBanner" class="result-banner">
        <h2>🎉 KẾT QUẢ BÀI THI</h2>
        <div class="result-score"><span id="finalScore">0</span> / 280</div>
        <p class="result-text" id="feedbackGrade">Đã hoàn thành chấm bài!</p>
      </div>

      <!-- Khung câu hỏi hiện tại -->
      <div class="question-box">
        <div>
          <div class="q-header">
            <span class="q-badge" id="qBadge">Câu 1 / 28</span>
            <span class="q-type" id="qType">Trắc nghiệm 4 lựa chọn</span>
          </div>
          <div class="q-title" id="qTitle">Nội dung câu hỏi...</div>
          <div class="q-options" id="qOptions">
            <!-- Tự động kết xuất các lựa chọn -->
          </div>
        </div>

        <!-- Nút tới / lui -->
        <div class="nav-controls">
          <button class="btn-nav" id="btnPrev" onclick="navigateQ(-1)">⬅️ Câu trước</button>
          <span style="font-size:0.9rem; color:var(--text-muted); font-weight:600;" id="qIndicator">1 / 28</span>
          <button class="btn-nav" id="btnNext" onclick="navigateQ(1)">Câu sau ➡️</button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="btn-action-container">
        <button class="btn-submit" onclick="submitAssessment()">🚀 NỘP BÀI & CHẤM ĐIỂM</button>
        <button class="btn-reset" onclick="resetAssessment()">🔄 LÀM LẠI BÀI THI</button>
      </div>

    </div>

  </div>

  <script>
    // Audio synthesis without external audio files
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'success') {
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // NGÂN HÀNG 28 CÂU HỎI
    const questions = [
      { id: 1, type: 'mcq', title: 'Cần tối thiểu bao nhiêu máy tính kết nối với nhau để tạo thành một mạng máy tính?', opts: ['A. 1 máy tính', 'B. 2 máy tính', 'C. 5 máy tính', 'D. 10 máy tính trở lên'], ans: 1 },
      { id: 2, type: 'mcq', title: 'Lợi ích cơ bản nhất của mạng máy tính là gì?', opts: ['A. Giúp máy tính chạy nhanh hơn và tăng tuổi thọ pin', 'B. Giúp tiết kiệm điện năng tiêu thụ', 'C. Trao đổi thông tin, chia sẻ dữ liệu và dùng chung các thiết bị', 'D. Tự động sửa chữa phần cứng khi hỏng'], ans: 2 },
      { id: 3, type: 'mcq', title: 'Một mạng máy tính tiêu chuẩn gồm có mấy thành phần chính?', opts: ['A. 2 thành phần', 'B. 3 thành phần', 'C. 4 thành phần', 'D. 5 thành phần'], ans: 1 },
      { id: 4, type: 'mcq', title: 'Thiết bị nào sau đây được xếp vào nhóm "Thiết bị đầu cuối"?', opts: ['A. Bộ chuyển mạch (Switch)', 'B. Bộ định tuyến (Router)', 'C. Dây cáp mạng', 'D. Máy in kết nối mạng'], ans: 3 },
      { id: 5, type: 'mcq', title: 'Nhóm thiết bị nào sau đây đều thuộc nhóm "Thiết bị kết nối"?', opts: ['A. Cáp mạng, Switch (bộ chuyển mạch), Router (bộ định tuyến)', 'B. Máy tính để bàn, laptop, smartphone', 'C. Máy quét, máy in, máy ảnh số', 'D. Màn hình, bàn phím, chuột máy tính'], ans: 0 },
      { id: 6, type: 'mcq', title: 'Môi trường truyền dẫn của mạng không dây sử dụng loại sóng nào?', opts: ['A. Sóng âm thanh', 'B. Sóng vô tuyến (như Wi-Fi, Bluetooth)', 'C. Sóng siêu âm', 'D. Dây dẫn kim loại'], ans: 1 },
      { id: 7, type: 'mcq', title: 'Thiết bị nào thực hiện nhiệm vụ phát sóng và kết nối các thiết bị không dây vào mạng?', opts: ['A. Bộ định tuyến không dây (Wireless Router / Access Point)', 'B. Dây cáp mạng LAN', 'C. Máy quét tài liệu', 'D. Máy in laser'], ans: 0 },
      { id: 8, type: 'mcq', title: 'Ưu điểm nổi bật nhất của mạng không dây so với mạng có dây là gì?', opts: ['A. Không bao giờ bị mất tín hiệu', 'B. Thuận tiện lắp đặt, người dùng linh hoạt di chuyển mà vẫn giữ kết nối', 'C. Tốc độ luôn nhanh gấp 100 lần mạng cáp', 'D. Không cần dùng bất kỳ thiết bị kết nối nào'], ans: 1 },
      { id: 9, type: 'mcq', title: 'Khi một máy tính trong phòng tin học gửi lệnh in tới máy in dùng chung, hoạt động này thể hiện lợi ích nào?', opts: ['A. Chia sẻ tài nguyên phần cứng (dùng chung thiết bị)', 'B. Tăng bộ nhớ cho máy in', 'C. Diệt virus cho máy in', 'D. Tiết kiệm mực in'], ans: 0 },
      { id: 10, type: 'mcq', title: 'Thành phần nào đóng vai trò như hệ thống duy trì "luật lệ giao thông" trên mạng máy tính?', opts: ['A. Thiết bị đầu cuối', 'B. Phần mềm mạng', 'C. Dây cáp mạng', 'D. Cột ăng-ten'], ans: 1 },
      { id: 11, type: 'mcq', title: 'Điểm tương đồng nổi bật giữa mạng giao thông và mạng máy tính là:', opts: ['A. Cùng có phương tiện cơ giới chạy qua', 'B. Cùng có tính kết nối và chia sẻ tài nguyên', 'C. Cùng làm bằng xi măng cốt thép', 'D. Cùng chịu sự điều khiển của đèn tín hiệu giao thông 3 màu'], ans: 1 },
      { id: 12, type: 'mcq', title: 'Thiết bị nào sau đây KHÔNG PHẢI là thiết bị đầu cuối?', opts: ['A. Điện thoại thông minh', 'B. Máy tính xách tay (Laptop)', 'C. Bộ chuyển mạch (Switch)', 'D. Máy quét (Scanner)'], ans: 2 },
      { id: 13, type: 'mcq', title: 'Khi gửi tệp hình ảnh bài tập từ laptop sang máy tính của bạn An trong cùng phòng, bạn đã thực hiện hoạt động gì?', opts: ['A. Trao đổi và chia sẻ dữ liệu', 'B. Sửa chữa hệ điều hành', 'C. Nâng cấp ổ cứng', 'D. Tiết kiệm dung lượng RAM'], ans: 0 },
      { id: 14, type: 'mcq', title: 'Đường truyền dữ liệu "nhìn thấy được" trong mạng máy tính là gì?', opts: ['A. Sóng vô tuyến Wi-Fi', 'B. Sóng Bluetooth', 'C. Dây cáp mạng', 'D. Sóng hồng ngoại'], ans: 2 },
      { id: 15, type: 'mcq', title: 'Trường hợp nào sau đây mạng không dây tiện dụng và ưu việt hơn mạng có dây?', opts: ['A. Khi hành khách đang đi trên xe buýt cần dùng smartphone đọc tin tức', 'B. Khi cố định một máy chủ lớn trong phòng kín nhiều năm', 'C. Khi cần nối 2 máy tính đặt sát cạnh nhau trên bàn làm việc cố định', 'D. Khi không có thiết bị phát sóng vô tuyến'], ans: 0 },
      { id: 16, type: 'mcq', title: 'Thiết bị nào sau đây vừa có thể kết nối mạng có dây vừa có thể kết nối mạng không dây?', opts: ['A. Máy tính xách tay (Laptop)', 'B. Dây cáp mạng xoắn đôi', 'C. Chuột quang có dây', 'D. Đĩa CD'], ans: 0 },
      { id: 17, type: 'mcq', title: 'Tại sao ở các nơi công cộng như sân bay, quán cà phê người ta thường lắp đặt mạng không dây?', opts: ['A. Vì không mất tiền điện', 'B. Giúp nhiều người truy cập linh hoạt, không cần kéo dây rườm rà', 'C. Vì sóng không dây không cần thiết bị truyền dẫn', 'D. Vì mạng không dây không bao giờ gặp sự cố'], ans: 1 },
      { id: 18, type: 'mcq', title: 'Bộ chuyển mạch (Switch) đóng vai trò gì trong mạng máy tính?', opts: ['A. Là thiết bị kết nối trung gian giúp các máy tính liên kết với nhau', 'B. Là thiết bị đầu cuối để gõ chữ', 'C. Là phần mềm diệt virus', 'D. Là thiết bị lưu trữ giống USB'], ans: 0 },
      { id: 19, type: 'mcq', title: 'Ví dụ nào sau đây là ứng dụng truyền thông (phần mềm mạng) trên thiết bị đầu cuối?', opts: ['A. Ứng dụng Zalo, Gmail, Trình duyệt web Chrome', 'B. Dây cáp mạng', 'C. Bộ định tuyến Router', 'D. Chuột máy tính'], ans: 0 },
      { id: 20, type: 'mcq', title: 'Tác nhân nào sau đây có thể làm hư hại đường truyền mạng có dây mà ít ảnh hưởng đến mạng không dây?', opts: ['A. Đứt cáp do mưa bão hoặc động vật (chuột) cắn', 'B. Hết pin điện thoại', 'C. Tắt nguồn màn hình', 'D. Bụi bám bàn phím'], ans: 0 },
      { id: 21, type: 'mcq', title: 'Phát biểu nào sau đây đúng khi nói về mạng máy tính?', opts: ['A. Mạng máy tính chỉ truyền được dữ liệu dạng chữ, không truyền được ảnh và video', 'B. Mạng máy tính kết nối các thiết bị để truyền thông tin và chia sẻ tài nguyên', 'C. Mọi thiết bị kết nối mạng đều bắt buộc phải dùng dây', 'D. Người dùng trong mạng không thể gửi tệp cho nhau'], ans: 1 },
      { id: 22, type: 'mcq', title: 'Khi kết nối 5 máy tính trong thư viện trường, thiết bị trung gian kết nối thường được dùng là:', opts: ['A. Bộ chuyển mạch (Switch) hoặc Bộ phát Wi-Fi (Router)', 'B. Máy quét ảnh', 'C. Máy chiếu đa năng', 'D. Loa thùng'], ans: 0 },
      { id: 23, type: 'mcq', title: 'Khi điện thoại của em kết nối Bluetooth với tai nghe không dây để nghe nhạc, đây là dạng kết nối gì?', opts: ['A. Kết nối mạng không dây sử dụng sóng ngắn', 'B. Kết nối cáp đồng trục', 'C. Kết nối mạng có dây siêu nhỏ', 'D. Kết nối qua vệ tinh viễn thông'], ans: 0 },
      { id: 24, type: 'mcq', title: 'Để một mạng máy tính hoạt động trơn tru và an toàn, cần có yếu tố nào điều khiển và quản lý quá trình truyền dữ liệu?', opts: ['A. Phần mềm mạng', 'B. Vỏ case máy tính', 'C. Giấy in', 'D. Bàn di chuột'], ans: 0 },
      { id: 25, type: 'tf', title: 'Câu 25 (Đ/S): "Chỉ những máy tính để bàn (PC) và máy tính xách tay (Laptop) mới được xem là thiết bị đầu cuối trong mạng máy tính."', opts: ['ĐÚNG', 'SAI'], ans: 1 },
      { id: 26, type: 'tf', title: 'Câu 26 (Đ/S): "Điện thoại thông minh kết nối vào bộ phát Wi-Fi tại nhà là một ví dụ tiêu biểu về kết nối mạng không dây."', opts: ['ĐÚNG', 'SAI'], ans: 0 },
      { id: 27, type: 'tf', title: 'Câu 27 (Đ/S): "Việc lắp đặt mạng không dây giúp tránh được nguy cơ đứt đường truyền do thiên tai bão gió hoặc chuột cắn dây dẫn."', opts: ['ĐÚNG', 'SAI'], ans: 0 },
      { id: 28, type: 'tf', title: 'Câu 28 (Đ/S): "Mạng máy tính chỉ có thể kết nối các thiết bị trong cùng một căn phòng, không thể mở rộng quy mô toàn cầu."', opts: ['ĐÚNG', 'SAI'], ans: 1 }
    ];

    let currentQIdx = 0;
    let userAnswers = {};
    let isSubmitted = false;

    function initQuiz() {
      const palette = document.getElementById('paletteGrid');
      palette.innerHTML = '';
      
      questions.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'palette-item' + (idx === 0 ? ' current' : '');
        item.id = `pal-${idx}`;
        item.innerText = idx < 24 ? (idx + 1) : `${idx + 1}*`;
        item.title = `Chuyển tới câu ${idx + 1}`;
        item.onclick = () => jumpToQ(idx);
        palette.appendChild(item);
      });

      renderQuestion(0);
      updateStatusCount();
    }

    function renderQuestion(idx) {
      currentQIdx = idx;
      const q = questions[idx];

      document.getElementById('qBadge').innerText = `Câu ${idx + 1} / 28`;
      document.getElementById('qType').innerText = q.type === 'mcq' ? 'Trắc nghiệm 4 lựa chọn' : 'Trắc nghiệm Đúng / Sai';
      document.getElementById('qTitle').innerText = q.title;
      document.getElementById('qIndicator').innerText = `${idx + 1} / 28`;

      document.getElementById('btnPrev').disabled = (idx === 0);
      document.getElementById('btnNext').disabled = (idx === questions.length - 1);

      document.querySelectorAll('.palette-item').forEach((p, i) => {
        if (i === idx) p.classList.add('current');
        else p.classList.remove('current');
      });

      const optContainer = document.getElementById('qOptions');
      optContainer.innerHTML = '';

      q.opts.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = optText;

        if (userAnswers[idx] === optIdx) {
          btn.classList.add('selected');
        }

        if (isSubmitted) {
          btn.classList.add('disabled');
          if (optIdx === q.ans) {
            btn.classList.add('correct-ans');
          } else if (userAnswers[idx] === optIdx) {
            btn.classList.add('wrong-ans');
          }
        } else {
          btn.onclick = () => selectOption(idx, optIdx);
        }

        optContainer.appendChild(btn);
      });
    }

    function selectOption(qIdx, optIdx) {
      if (isSubmitted) return;
      userAnswers[qIdx] = optIdx;
      
      document.getElementById(`pal-${qIdx}`).classList.add('answered');
      renderQuestion(qIdx);
      updateStatusCount();
    }

    function navigateQ(step) {
      const newIdx = currentQIdx + step;
      if (newIdx >= 0 && newIdx < questions.length) {
        renderQuestion(newIdx);
      }
    }

    function jumpToQ(idx) {
      renderQuestion(idx);
    }

    function updateStatusCount() {
      const count = Object.keys(userAnswers).length;
      document.getElementById('answeredCount').innerText = `${count}/28 đã làm`;
    }

    function submitAssessment() {
      if (isSubmitted) {
        alert('Bạn đã nộp bài rồi! Bấm "Làm lại bài thi" nếu muốn thực hành lại.');
        return;
      }

      const totalAnswered = Object.keys(userAnswers).length;
      if (totalAnswered < questions.length) {
        const confirmSubmit = confirm(`Bạn mới trả lời ${totalAnswered}/${questions.length} câu. Bạn có chắc chắn muốn nộp bài không?`);
        if (!confirmSubmit) return;
      }

      isSubmitted = true;
      let score = 0;

      questions.forEach((q, idx) => {
        const pal = document.getElementById(`pal-${idx}`);
        pal.classList.remove('answered');

        if (userAnswers[idx] === q.ans) {
          score += 10;
          pal.classList.add('correct');
        } else {
          pal.classList.add('wrong');
        }
      });

      const banner = document.getElementById('resultBanner');
      const scoreElem = document.getElementById('finalScore');
      const gradeElem = document.getElementById('feedbackGrade');
      scoreElem.innerText = score;
      
      if (score >= 240) {
        gradeElem.innerText = '🌟 Xuất sắc! Em đã nắm rất vững toàn bộ 28 câu kiến thức Mạng máy tính!';
      } else if (score >= 180) {
        gradeElem.innerText = '👍 Khá tốt! Em hãy bấm lại các câu màu đỏ trên danh sách để xem lại kiến thức!';
      } else {
        gradeElem.innerText = '📖 Cần cố gắng hơn! Em hãy xem lại nội dung Bài 4 và bấm làm lại bài thi.';
      }

      banner.style.display = 'block';
      renderQuestion(currentQIdx);

      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (score >= 180) {
        playSound('success');
      } else {
        playSound('error');
      }
    }

    function resetAssessment() {
      userAnswers = {};
      isSubmitted = false;
      document.getElementById('resultBanner').style.display = 'none';
      
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = initQuiz;
  </script>
</body>
